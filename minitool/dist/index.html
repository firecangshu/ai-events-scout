<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI赛事百晓生</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #f5f6f8;
      color: #222;
    }
    html { touch-action: manipulation; }
    .touchable:active { opacity: 0.7; }
  </style>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-badge">AI赛事百晓生</div>
      <h1 class="hero-title">还能报名的 AI 赛事</h1>
      <p class="hero-sub" id="heroSub">加载中…</p>
      <div class="hero-stats" id="heroStats"></div>
    </header>

    <section class="filters" id="filters">
      <div class="search-row">
        <input id="searchInput" class="search-input" type="search" placeholder="搜索赛事名 / 主办方 / 资格关键词" autocomplete="off" />
        <button id="searchClear" class="search-clear" type="button" hidden aria-label="清除搜索">清除</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">地区</span>
        <div class="chips" id="chipsScope"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">区域</span>
        <div class="chips" id="chipsRegion"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">形式</span>
        <div class="chips" id="chipsForm"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">人群</span>
        <div class="chips" id="chipsElig"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">状态</span>
        <div class="chips" id="chipsUrgency"></div>
      </div>
    </section>

    <main class="list" id="list" aria-live="polite"></main>
    <p class="empty" id="empty" hidden>当前筛选下暂无赛事，试试放宽条件。</p>

    <footer class="foot">
      <p class="foot-note">数据为当日赛事快照，报名信息以各赛事官方页面为准。</p>
      <p class="foot-snap" id="footSnap"></p>
    </footer>
  </div>
  <script src="./assets/data.js"></script>
  <script src="./assets/main.js"></script>
</body>
</html>
